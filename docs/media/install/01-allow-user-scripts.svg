<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Enable Allow User Scripts for Tampermonkey</title>
  <desc id="desc">Chrome extension details with the Allow User Scripts switch highlighted and turned on.</desc>
  <rect width="960" height="300" fill="#f4f5f2"/>
  <rect x="24" y="20" width="912" height="260" rx="16" fill="#ffffff" stroke="#cfd5cc" stroke-width="2"/>
  <rect x="24" y="20" width="912" height="48" rx="16" fill="#252a27"/>
  <circle cx="52" cy="44" r="7" fill="#ef6a7b"/><circle cx="74" cy="44" r="7" fill="#e3b34c"/><circle cx="96" cy="44" r="7" fill="#65a778"/>
  <rect x="126" y="31" width="620" height="26" rx="7" fill="#3a403c"/>
  <text x="144" y="49" fill="#eef1ec" font-family="Segoe UI,Arial,sans-serif" font-size="13">chrome://extensions · Tampermonkey · Details</text>
  <rect x="58" y="92" width="52" height="52" rx="12" fill="#202422"/>
  <circle cx="84" cy="118" r="14" fill="none" stroke="#ffffff" stroke-width="4"/><circle cx="84" cy="118" r="4" fill="#ffffff"/>
  <text x="130" y="115" fill="#182019" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Tampermonkey</text>
  <text x="130" y="139" fill="#667068" font-family="Segoe UI,Arial,sans-serif" font-size="14">Extension details</text>
  <line x1="58" y1="164" x2="902" y2="164" stroke="#e1e5df" stroke-width="2"/>
  <text x="72" y="210" fill="#182019" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="650">Allow User Scripts</text>
  <text x="72" y="235" fill="#667068" font-family="Segoe UI,Arial,sans-serif" font-size="14">Required by Chrome for userscripts to run.</text>
  <rect x="796" y="186" width="80" height="40" rx="20" fill="#b83d67"/>
  <circle cx="856" cy="206" r="16" fill="#ffffff"/>
  <path d="M740 117 C804 124 822 148 832 180" fill="none" stroke="#b83d67" stroke-width="5" stroke-linecap="round"/>
  <path d="M818 167 L833 181 L840 162" fill="none" stroke="#b83d67" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="604" y="82" width="284" height="48" rx="8" fill="#fff1f6" stroke="#b83d67" stroke-width="2"/>
