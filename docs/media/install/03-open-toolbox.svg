<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Open Insta Toolbox on Instagram</title>
  <desc id="desc">Instagram with the movable IT button highlighted at the lower right and the Alt Shift I shortcut shown.</desc>
  <rect width="960" height="300" fill="#f4f5f2"/>
  <rect x="24" y="20" width="912" height="260" rx="16" fill="#ffffff" stroke="#cfd5cc" stroke-width="2"/>
  <rect x="24" y="20" width="912" height="48" rx="16" fill="#252a27"/>
  <circle cx="52" cy="44" r="7" fill="#ef6a7b"/><circle cx="74" cy="44" r="7" fill="#e3b34c"/><circle cx="96" cy="44" r="7" fill="#65a778"/>
  <rect x="126" y="31" width="650" height="26" rx="7" fill="#3a403c"/>
  <text x="144" y="49" fill="#eef1ec" font-family="Segoe UI,Arial,sans-serif" font-size="13">https://www.instagram.com/</text>
  <rect x="58" y="94" width="180" height="20" rx="5" fill="#dfe4dd"/>
  <rect x="58" y="130" width="132" height="12" rx="4" fill="#edf0eb"/>
  <rect x="300" y="88" width="310" height="154" rx="10" fill="#fafbf9" stroke="#e1e5df" stroke-width="2"/>
  <circle cx="455" cy="133" r="22" fill="#dfe4dd"/>
  <rect x="376" y="172" width="158" height="12" rx="4" fill="#dfe4dd"/>
  <rect x="398" y="198" width="114" height="10" rx="4" fill="#edf0eb"/>
  <rect x="840" y="208" width="56" height="56" rx="15" fill="#ffffff" stroke="#b83d67" stroke-width="3"/>
  <text x="854" y="244" fill="#7d2447" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="850">IT</text>
  <circle cx="886" cy="218" r="6" fill="#b83d67"/>
  <path d="M734 150 C790 160 830 184 852 205" fill="none" stroke="#b83d67" stroke-width="5" stroke-linecap="round"/>
  <path d="M833 198 L853 207 L846 187" fill="none" stroke="#b83d67" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="650" y="86" width="250" height="58" rx="8" fill="#fff1f6" stroke="#b83d67" stroke-width="2"/>
  <text x="670" y="111" fill="#7d2447" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Reload Instagram, then click IT</text>
  <text x="670" y="132" fill="#7d2447" font-family="Segoe UI,Arial,sans-serif" font-size="14">or press Alt + Shift + I</text>
</svg>
