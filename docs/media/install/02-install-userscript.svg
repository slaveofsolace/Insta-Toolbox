<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Install Insta Toolbox in Tampermonkey</title>
  <desc id="desc">Tampermonkey installer showing the Insta Toolbox userscript and highlighted Install button.</desc>
  <rect width="960" height="300" fill="#f4f5f2"/>
  <rect x="24" y="20" width="912" height="260" rx="16" fill="#ffffff" stroke="#cfd5cc" stroke-width="2"/>
  <rect x="24" y="20" width="912" height="48" rx="16" fill="#252a27"/>
  <circle cx="52" cy="44" r="7" fill="#ef6a7b"/><circle cx="74" cy="44" r="7" fill="#e3b34c"/><circle cx="96" cy="44" r="7" fill="#65a778"/>
  <rect x="126" y="31" width="650" height="26" rx="7" fill="#3a403c"/>
  <text x="144" y="49" fill="#eef1ec" font-family="Segoe UI,Arial,sans-serif" font-size="13">Tampermonkey · userscript installation</text>
  <rect x="58" y="91" width="52" height="52" rx="12" fill="#202422"/>
  <text x="75" y="126" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">IT</text>
