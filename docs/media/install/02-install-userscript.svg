  <rect x="786" y="194" width="116" height="46" rx="9" fill="#b83d67"/>
  <text x="817" y="223" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="750">Install</text>
  <path d="M650 110 C752 118 822 144 840 185" fill="none" stroke="#b83d67" stroke-width="5" stroke-linecap="round"/>
