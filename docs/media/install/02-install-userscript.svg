  <text x="130" y="138" fill="#667068" font-family="Segoe UI,Arial,sans-serif" font-size="14">Runs on instagram.com · updates from the latest GitHub release</text>
  <line x1="58" y1="164" x2="902" y2="164" stroke="#e1e5df" stroke-width="2"/>
