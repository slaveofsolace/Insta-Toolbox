<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Insta Toolbox thread unsend fixture</title>
  <style>
    body { margin: 0; font: 14px system-ui, sans-serif; }
    #thread { display: flex; flex-direction: column-reverse; height: 220px; overflow-y: auto; border: 1px solid #ccc; }
    .row { display: flex; padding: 6px 10px; }
    .row.mine { justify-content: flex-end; }
    .bubble { max-width: 60%; padding: 8px 12px; border-radius: 14px; background: #efefef; }
    .row.mine .bubble { background: #3797f0; color: #fff; }
    .menu-btn { display: none; margin: 0 6px; }
    .row.hovered .menu-btn { display: inline-block; }
    /* The portal deliberately carries no role="menu" — this is the shape that
       broke the previous implementation. */
    #portal { position: fixed; top: 10px; left: 10px; background: #fff; border: 1px solid #999; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div data-pagelet="IGDMessagesList">
    <div id="thread"></div>
  </div>
  <span id="stale-unsend-decoy">Unsend</span>
  <div id="portal" class="hidden"></div>

  <script>
    // Instagram mounts only a small moving window of a long conversation. This
    // fixture deliberately replaces those row nodes as scrollTop changes, so a
    // mounted-row high-water mark cannot masquerade as the conversation total.
    let thread = document.getElementById('thread');
    const portal = document.getElementById('portal');
    const virtualRange = 900;
    const windowSize = 4;
    let virtualScrollTop = 0;
    let delayedWindowUsed = false;
    let newMessageInjected = false;
    let oldestGrowthScheduled = false;
    const sentMessageIndexes = new Set([2, 9, 17, 24, 32, 40]);
    const logicalMessages = Array.from({ length: 42 }, (_, offset) => {
      const index = 42 - offset;
      return {
        id: `fixture-message-${index}`,
        index,
        mine: sentMessageIndexes.has(index),
        unsent: false,
      };
    });
    // Begin with messages 42..10 loaded. Reaching that provisional oldest edge
    // asynchronously loads messages 9..1 and replaces the scroller, matching
    // Instagram's paginated history behavior.
    let loadedCount = 33;
    globalThis.fixtureUnsentCount = 0;
    globalThis.fixtureLogicalMessageCount = logicalMessages.length;
    globalThis.fixtureCancelClicks = 0;
    globalThis.fixtureDecoyUnsendClicks = 0;
    globalThis.fixtureRenderedWindows = 0;
    globalThis.fixtureScrollerReplacements = 0;
    globalThis.fixtureDelayedWindows = 0;
    globalThis.fixtureNewMessages = 0;
    globalThis.fixtureInitialScrollHeight = virtualRange + 220;
    globalThis.fixtureMountedSentHighWater = 0;
    globalThis.fixtureOpenedIds = [];
    globalThis.fixtureConfirmedIds = [];
    globalThis.fixtureOldestBoundaryExpandedAt = null;
    globalThis.fixtureFirstMenuOpenedAt = null;
    globalThis.fixtureMenuOpenedBeforeOldestExpansion = false;
    globalThis.fixtureRemainingSentIds = () => logicalMessages
      .filter((message) => message.mine && !message.unsent)
      .map((message) => message.id);
    document.getElementById('stale-unsend-decoy').addEventListener('click', () => {
      globalThis.fixtureDecoyUnsendClicks += 1;
    });

    function currentRange() {
      return Math.max(
        620,
        virtualRange
          - ((logicalMessages.length - loadedCount) * 30)
          + (globalThis.fixtureNewMessages * 30)
          - (globalThis.fixtureUnsentCount * 25),
      );
    }

    function loadedMessages() {
      return logicalMessages.slice(0, Math.min(loadedCount, logicalMessages.length));
    }

    function makeRow(message) {
      const row = document.createElement('div');
      const sentByMe = message.mine && !message.unsent;
      row.className = `row ${sentByMe ? 'mine' : 'theirs'}`;
      row.setAttribute('role', 'row');
      row.setAttribute('data-message-id', message.id);
      row.setAttribute('data-sent-by-me', String(sentByMe));
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.setAttribute('dir', 'auto');
      bubble.textContent = message.unsent
        ? 'You unsent a message'
        : `${message.mine ? 'Sent' : 'Received'} message ${message.index}`;
      row.append(bubble);
      if (sentByMe) {
        const button = document.createElement('div');
        button.className = 'menu-btn';
        button.setAttribute('role', 'button');
        button.setAttribute('aria-haspopup', 'menu');
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('aria-label', 'See more options for message');
        button.append(svg);
        button.addEventListener('click', () => openMenu(row, message.id));
        row.append(button);
      }
      row.addEventListener('pointerover', () => row.classList.add('hovered'));
      row.addEventListener('mouseover', () => row.classList.add('hovered'));
      row.addEventListener('pointerout', () => row.classList.remove('hovered'));
      return row;
    }

    function renderWindow() {
      const range = currentRange();
      const ratio = Math.min(1, Math.abs(virtualScrollTop) / range);
      const available = loadedMessages();
      const start = Math.min(
        available.length - windowSize,
        Math.floor(ratio * (available.length - windowSize)),
      );
      const mounted = available.slice(start, start + windowSize);
      thread.replaceChildren(...mounted.map(makeRow));
      globalThis.fixtureRenderedWindows += 1;
      globalThis.fixtureMountedSentHighWater = Math.max(
        globalThis.fixtureMountedSentHighWater,
        mounted.filter((message) => message.mine && !message.unsent).length,
      );
    }

    function bindScroller(element) {
      Object.defineProperties(element, {
        clientHeight: { configurable: true, get: () => 220 },
        scrollHeight: {
          configurable: true,
          get: () => currentRange() + 220,
        },
        scrollTop: {
          configurable: true,
          get: () => virtualScrollTop,
          set(value) {
            const range = currentRange();
            virtualScrollTop = Math.max(-range, Math.min(0, Number(value) || 0));
            const ratio = Math.abs(virtualScrollTop) / range;
            if (!oldestGrowthScheduled && loadedCount < logicalMessages.length && ratio >= 0.98) {
              oldestGrowthScheduled = true;
              setTimeout(() => {
                loadedCount = logicalMessages.length;
                globalThis.fixtureOldestBoundaryExpandedAt = performance.now();
                replaceScroller();
              }, 260);
            }
            if (!delayedWindowUsed && ratio > 0.45 && ratio < 0.7) {
              delayedWindowUsed = true;
              globalThis.fixtureDelayedWindows += 1;
              setTimeout(renderWindow, 20);
            } else {
              renderWindow();
            }
          },
        },
      });
    }

    function replaceScroller() {
      const replacement = document.createElement('div');
      replacement.id = 'thread';
      thread.replaceWith(replacement);
      thread = replacement;
      bindScroller(thread);
      globalThis.fixtureScrollerReplacements += 1;
      renderWindow();
    }

    bindScroller(thread);
    renderWindow();

    function openMenu(row, messageId) {
      if (globalThis.fixtureFirstMenuOpenedAt === null) {
        globalThis.fixtureFirstMenuOpenedAt = performance.now();
        globalThis.fixtureMenuOpenedBeforeOldestExpansion = loadedCount < logicalMessages.length;
      }
      globalThis.fixtureOpenedIds.push(messageId);
      portal.classList.remove('hidden');
      portal.replaceChildren();
      for (const label of ['Reply', 'Forward', 'Unsend']) {
        const item = document.createElement('div');
        item.setAttribute('role', 'button');
        const span = document.createElement('span');
        span.textContent = label;
        item.append(span);
        if (label === 'Unsend') item.addEventListener('click', () => openDialog(row, messageId));
        portal.append(item);
      }
    }

    function openDialog(row, messageId) {
      portal.classList.add('hidden');
      const dialog = document.createElement('div');
      dialog.setAttribute('role', 'dialog');
      dialog.id = 'confirm-dialog';
      const cancel = document.createElement('button');
      cancel.textContent = 'Cancel';
      cancel.addEventListener('click', () => {
        globalThis.fixtureCancelClicks += 1;
        dialog.remove();
      });
      const confirm = document.createElement('button');
      confirm.textContent = 'Unsend';
      confirm.addEventListener('click', () => {
        dialog.remove();
        const message = logicalMessages.find((candidate) => candidate.id === messageId);
        if (!message || message.unsent) return;
        message.unsent = true;
        globalThis.fixtureUnsentCount += 1;
        globalThis.fixtureConfirmedIds.push(messageId);
        // A received message arriving during the run grows the virtual range
        // but must not reset progress or be mistaken for a sent target.
        if (!newMessageInjected) {
          newMessageInjected = true;
          logicalMessages.unshift({
            id: 'fixture-new-received',
            index: 43,
            mine: false,
            unsent: false,
          });
          loadedCount = Math.min(logicalMessages.length, loadedCount + 1);
          globalThis.fixtureNewMessages += 1;
          globalThis.fixtureLogicalMessageCount = logicalMessages.length;
        }
        // Replace mounted rows every time, and replace the scroller itself once
        // to prove the runner reacquires Instagram's live virtual-list root.
        if (globalThis.fixtureUnsentCount === 2) replaceScroller();
        else renderWindow();
      });
      dialog.append(cancel, confirm);
      document.body.append(dialog);
    }
  </script>
  <!-- The engine exactly as shipped; the toolbox shell is not needed here. -->
  <script src="/extension/action-labels.js"></script>
  <script src="/extension/content-instagram.js"></script>
</body>
</html>
