<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Insta Toolbox</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="mark" aria-hidden="true">IT</div>
      <div>
      <p class="eyebrow">Companion setup</p>
      <h1>Connect workspace</h1>
      <p id="active-origin">Open the PWA in this tab before pairing.</p>
      </div>
    </header>

    <p class="field-note"><strong>The toolbox lives on Instagram.</strong> This popup pairs the PWA.</p>

    <form id="pairing-form">
      <label for="pairing-code">One-time pairing code</label>
      <textarea id="pairing-code" rows="3" spellcheck="false" autocomplete="off" required></textarea>
      <label class="check">
        <input id="action-permission" type="checkbox">
        Allow reviewed jobs and controlled one-item action intents
      </label>
      <button type="submit">Pair exact workspace origin</button>
    </form>

    <p class="notice"><strong>Inactive by default.</strong> Each action requires an exact confirmation and is rechecked before Instagram is changed. Cookies stay in the browser.</p>
    <div id="status" role="status" aria-live="polite"></div>
    <section aria-labelledby="pairings-heading">
      <h2 id="pairings-heading">Saved pairings</h2>
      <div id="pairings"></div>
    </section>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
